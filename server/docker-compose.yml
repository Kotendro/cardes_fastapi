services:
  postgres:
    image: postgres:16
    container_name: ${DB__CONTAINER_NAME}
    environment:
      POSTGRES_USER: ${DB__PG_USER}
      POSTGRES_PASSWORD: ${DB__PG_PASSWORD}
      POSTGRES_DB: ${DB__PG_DB}
    ports:
      - "5432:5432"
    volumes:
      - data:/var/lib/postgresql/data

volumes:
  data: