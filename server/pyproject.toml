[project]
name = "server"
version = "0.1.0"
description = ""
authors = [
    {name = "kotendro",email = "i.abramtsov@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "annotated-doc (==0.0.4)",
    "annotated-types (==0.7.0)",
    "anyio (==4.14.1)",
    "asyncpg (==0.31.0)",
    "click (==8.4.2)",
    "fastapi (==0.139.0)",
    "greenlet (==3.5.3)",
    "h11 (==0.16.0)",
    "idna (==3.18)",
    "pillow (==12.3.0)",
    "pydantic (==2.13.4)",
    "pydantic-settings (==2.14.2)",
    "pydantic-core (==2.46.4)",
    "python-dotenv (==1.2.2)",
    "python-multipart (==0.0.32)",
    "sqlalchemy (==2.0.51)",
    "starlette (==1.3.1)",
    "typing-inspection (==0.4.2)",
    "typing-extensions (==4.16.0)",
    "uvicorn (==0.49.0)"
]

[tool.poetry]
packages = [
    { include = "src" },
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
dev = 'src.main:run_dev'